[project]
name = "candidateselectionpredictionmodel"
version = "1.0.0"
description = "A Candidate selection ML Model"
readme = "README.md"
authors = [
    { name = "deveshdubey18", email = "314devesh11scic@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flaml[automl]>=2.6.0",
    "imblearn>=0.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
candidateselectionpredictionmodel = "candidateselectionpredictionmodel:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
